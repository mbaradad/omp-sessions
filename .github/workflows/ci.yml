name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Windows (named pipes, .cmd shims) is handled but not yet a supported platform: report, don't block.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        experimental: [false]
        include:
          - os: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit suite (no AO, no omp, no model calls). The integration suite (npm run test:integration) needs an `ao` binary,
      # and the desktop e2e (npm run test:e2e:desktop) needs AO, VS Code and a logged-in omp: both run on a developer machine.
      - run: npm test
      # `hermes plugins install …/integrations/hermes/switchyard` installs the folder as committed.
      - name: Hermes plugin folder matches the build
        if: matrix.os == 'ubuntu-latest'
        run: |
          node build.mjs
          git status --porcelain --ignored -- integrations/hermes/switchyard | grep . && { git diff -- integrations/hermes/switchyard; exit 1; } || true

  package:
    name: package vsix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package (vscode:prepublish typechecks and builds minified)
        run: npm run package
      - name: List packaged files
        run: npx vsce ls
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error
