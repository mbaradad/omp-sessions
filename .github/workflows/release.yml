name: Release

# Push a tag `v<version>` matching package.json's version (e.g. `git tag v0.5.0 && git push origin v0.5.0`).
# Marketplace auth: Trusted Publishing (OIDC), no stored token — the publisher has a policy for
# mbaradad/switchyard, workflow release.yml (docs/PUBLISHING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # OIDC token exchanged by `vsce publish --oidc` for a 15-minute Marketplace credential.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=switchyard-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          node -e '
            const [version] = process.argv.slice(1);
            const text = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const start = text.indexOf(`\n## ${version}\n`);
            if (start < 0) { console.error(`CHANGELOG.md has no "## ${version}" section`); process.exit(1); }
            const rest = text.slice(start + 1);
            const end = rest.indexOf("\n## ", 1);
            require("fs").writeFileSync("release-notes.md", (end < 0 ? rest : rest.slice(0, end)).split("\n").slice(1).join("\n").trim() + "\n");
          ' "${{ steps.version.outputs.version }}"

      - run: npm test

      - name: Package (vscode:prepublish typechecks and builds minified)
        run: npx vsce package --no-dependencies -o "${{ steps.version.outputs.vsix }}"

      # The standalone `switchyard` command (npm install -g <release asset URL>), from the same minified out/.
      - name: Package the standalone CLI
        id: cli
        run: echo "tgz=$(node packaging/cli/pack.mjs out --dest .)" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace (Trusted Publishing)
        run: npx vsce publish --oidc --no-dependencies --packagePath "${{ steps.version.outputs.vsix }}"

      - name: Publish to Open VSX
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::secret OVSX_PAT is not set; skipping Open VSX"; exit 0; fi
          npx --yes ovsx publish "${{ steps.version.outputs.vsix }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.version.outputs.vsix }}" "${{ steps.cli.outputs.tgz }}" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
