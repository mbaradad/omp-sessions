name: omp-sessions
label: omp Sessions
version: 0.6.0
description: Start, schedule and supervise omp coding sessions (omp-vs) from Hermes, hear back when they settle, and run kanban cards assigned to omp as omp sessions.
author: Manel Baradad
license: MIT
homepage: https://mbaradad.github.io/omp-vscode/
tags: [coding, omp, sessions, kanban, scheduling]
requires_hermes: ">=0.23.0"
provides_tools:
  - omp_sessions_list
  - omp_projects_list
  - omp_session_start
  - omp_session_status
  - omp_session_wait
  - omp_session_send
  - omp_session_answer
  - omp_session_mode
  - omp_session_stop
provides_hooks:
  - on_kanban_dispatch_tick
