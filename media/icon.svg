<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<!-- Switchyard's Marketplace icon (source of icon.png, 256×256): the mark of media/switchyard.svg, one track
     fanning out into three, on a dark tile. -->
<defs>
 <radialGradient id="bg" cx=".3" cy=".22" r=".95"><stop offset="0" stop-color="#2a1842"/><stop offset=".55" stop-color="#160f22"/><stop offset="1" stop-color="#0b0811"/></radialGradient>
 <radialGradient id="halo" cx=".62" cy=".5" r=".5"><stop offset="0" stop-color="#9b4dff" stop-opacity=".35"/><stop offset="1" stop-color="#9b4dff" stop-opacity="0"/></radialGradient>
 <linearGradient id="brand" x1="2" y1="12" x2="22" y2="12" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ed4abf"/><stop offset=".5" stop-color="#9b4dff"/><stop offset="1" stop-color="#5ad8e6"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".9"/></filter>
</defs>
<rect width="256" height="256" rx="58" fill="url(#bg)"/>
<rect width="256" height="256" rx="58" fill="url(#halo)"/>
<g transform="translate(20 20) scale(9)" fill="none" stroke="url(#brand)" stroke-linecap="round" stroke-linejoin="round">
 <path d="M2.5 12H8M8 12C11 12 12 5 16 5H21.5M8 12H21.5M8 12C11 12 12 19 16 19H21.5" stroke-width="2.6" opacity=".6" filter="url(#glow)"/>
 <path d="M2.5 12H8M8 12C11 12 12 5 16 5H21.5M8 12H21.5M8 12C11 12 12 19 16 19H21.5" stroke-width="2.4"/>
</g>
<rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
